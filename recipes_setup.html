async function run(){
  try{
    log("Checking for existing Recipes table...","info");
    const meta = await fetch(`https://api.airtable.com/v0/meta/bases/${BASE}/tables`,{headers:H}).then(r=>r.json());
    let existing = meta.tables.find(t=>t.name==="Recipes");
    let tableId;

    if(existing){
      tableId = existing.id;
      log("Recipes table found (ID "+tableId+"). Existing ratings/comments will NOT be touched.","info");

      const tagField = existing.fields.find(f=>f.name==="Ingredient Tags");
      if(tagField && tagField.options && tagField.options.choices){
        const existingTags = new Set(tagField.options.choices.map(c=>c.name));
        const missingTags = INGREDIENT_TAGS.filter(t=>!existingTags.has(t));
        if(missingTags.length){
          log("Adding "+missingTags.length+" new ingredient tag options...","info");
          const allChoices = tagField.options.choices.concat(missingTags.map(n=>({name:n})));
          const pr = await fetch(`https://api.airtable.com/v0/meta/bases/${BASE}/tables/${tableId}/fields/${tagField.id}`,{
            method:"PATCH",headers:H,body:JSON.stringify({options:{choices:allChoices}})
          });
          if(pr.ok){ log("Tag options updated.","ok"); }
          else { log("Tag update warning: "+JSON.stringify(await pr.json()),"err"); }
        }
      }

      const existingNames = new Set();
      let offset;
      do{
        const url = `https://api.airtable.com/v0/${BASE}/${tableId}?fields%5B%5D=Recipe${offset?`&offset=${offset}`:''}`;
        const r = await fetch(url,{headers:H}).then(r=>r.json());
        r.records.forEach(x=>{ if(x.fields.Recipe) existingNames.add(x.fields.Recipe); });
        offset = r.offset;
      }while(offset);
      log("Found "+existingNames.size+" recipes already in the table.","info");

      const toAdd = recipes.filter(r=>!existingNames.has(r.Recipe));
      if(!toAdd.length){ log("Nothing new to add - all "+recipes.length+" recipes already present.","ok"); return; }
      log("Adding "+toAdd.length+" new recipes (skipping "+(recipes.length-toAdd.length)+" already present)...","info");
      for(let i=0;i<toAdd.length;i+=5){
        const batch = toAdd.slice(i,i+5).map(r=>({fields:r}));
        const cr = await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}`,{method:"POST",headers:H,body:JSON.stringify({records:batch,typecast:true})});
        const cj = await cr.json();
        if(!cr.ok){log("ADD BATCH FAILED: "+JSON.stringify(cj),"err");return;}
        cj.records.forEach(x=>log("  + "+x.fields.Recipe,"ok"));
      }
      log("DONE. Added "+toAdd.length+" recipes. Existing ratings preserved.","ok");
      return;
    }

    log("Creating Recipes table...","info");
    let res = await fetch(`https://api.airtable.com/v0/meta/bases/${BASE}/tables`,{method:"POST",headers:H,body:JSON.stringify(tableSpec)});
    let js = await res.json();
    if(!res.ok){ log("CREATE TABLE FAILED: "+JSON.stringify(js),"err"); return; }
    tableId = js.id;
    log("Table created. ID: "+tableId,"ok");

    log("Seeding "+recipes.length+" recipes...","info");
    for(let i=0;i<recipes.length;i+=5){
      const batch = recipes.slice(i,i+5).map(r=>({fields:r}));
      const cr = await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}`,{method:"POST",headers:H,body:JSON.stringify({records:batch,typecast:true})});
      const cj = await cr.json();
      if(!cr.ok){log("SEED BATCH FAILED: "+JSON.stringify(cj),"err");return;}
      log("Batch "+(Math.floor(i/5)+1)+": created "+cj.records.length+" records","ok");
    }

    const vr = await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}?fields%5B%5D=Recipe`,{headers:H}).then(r=>r.json());
    log("DONE. Table ID: "+tableId+" - "+vr.records.length+" recipes seeded.","ok");
  }catch(e){ log("ERROR: "+e.message,"err"); }
}
run();
