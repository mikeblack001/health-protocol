async function run(){
  try{
    log("Checking for existing Recipes table...","info");
    const meta = await fetch(`https://api.airtable.com/v0/meta/bases/${BASE}/tables`,{headers:H}).then(r=>r.json());
    let existing = meta.tables.find(t=>t.name==="Recipes");
    let tableId;

    if(existing){
      log("Recipes table already exists (ID "+existing.id+"). Deleting old records before re-seed...","info");
      tableId = existing.id;
      let allIds = [];
      let offset;
      do{
        const url = `https://api.airtable.com/v0/${BASE}/${tableId}${offset?`?offset=${offset}`:''}`;
        const r = await fetch(url,{headers:H}).then(r=>r.json());
        allIds.push(...r.records.map(x=>x.id));
        offset = r.offset;
      }while(offset);
      for(let i=0;i<allIds.length;i+=10){
        const batch = allIds.slice(i,i+10);
        const qs = batch.map(id=>`records[]=${id}`).join('&');
        await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}?${qs}`,{method:"DELETE",headers:H});
      }
      log(`Cleared ${allIds.length} old records.`,"ok");
    } else {
      log("Creating Recipes table...","info");
      let res = await fetch(`https://api.airtable.com/v0/meta/bases/${BASE}/tables`,{method:"POST",headers:H,body:JSON.stringify(tableSpec)});
      let js = await res.json();
      if(!res.ok){ log("CREATE TABLE FAILED: "+JSON.stringify(js),"err"); return; }
      tableId = js.id;
      log("Table created. ID: "+tableId,"ok");
    }

    log(`Seeding ${recipes.length} recipes...`,"info");
    for(let i=0;i<recipes.length;i+=5){
      const batch = recipes.slice(i,i+5).map(r=>({fields:r}));
      const cr = await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}`,{method:"POST",headers:H,body:JSON.stringify({records:batch,typecast:true})});
      const cj = await cr.json();
      if(!cr.ok){log("SEED BATCH FAILED: "+JSON.stringify(cj),"err");return;}
      log(`Batch ${Math.floor(i/5)+1}: created ${cj.records.length} records`,"ok");
    }

    log("Read-back verification...","info");
    const vr = await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}?fields%5B%5D=Recipe&fields%5B%5D=Machine`,{headers:H}).then(r=>r.json());
    log(`Verified ${vr.records.length} records in table:`,"ok");
    vr.records.forEach(r=>log("  - "+r.fields.Recipe+" ["+(r.fields.Machine||"")+"]"));
    log("\nDONE. Table ID: "+tableId+"\nGo to recipes.html to use the picker.","ok");
  }catch(e){ log("ERROR: "+e.message,"err"); }
}
run();
